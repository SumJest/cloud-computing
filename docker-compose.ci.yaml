version: "3.8"
services:
  cloud-computing:
    image: $CI_REGISTRY_IMAGE:$DOCKER_TAG
    restart: unless-stopped
    environment:
      WORD_SORT_SERVER_HOST: 0.0.0.0
      WORD_SORT_SERVER_PORT: 8124
      CITIES_SERVER_HOST: 0.0.0.0
      CITIES_SERVER_PORT: 8125
    ports:
      - '8124:8124'
      - '8125:8125'